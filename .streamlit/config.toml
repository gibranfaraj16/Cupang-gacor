# =====================================================================
# SiCupang - Premium Teal Gray Theme
# =====================================================================

[theme]
base = "light"

# Aksen utama
primaryColor = "#168C8C"

# Background utama
backgroundColor = "#E9F0EF"

# Background card, input, container
secondaryBackgroundColor = "#F7FAF9"

# Warna teks
textColor = "#263B3D"

# Link
linkColor = "#168C8C"

# Border
borderColor = "#D0DEDC"
showWidgetBorder = true

# Radius
baseRadius = "large"

# Font
font = "sans serif"

# Code background
codeBackgroundColor = "#E0EBE9"

# Chart colors
chartCategoricalColors = [
    "#168C8C",
    "#E8798D",
    "#4D91B8",
    "#D6A64F",
    "#8B83C9",
    "#65A88D"
]


# =====================================================================
# SIDEBAR
# =====================================================================

[theme.sidebar]
backgroundColor = "#DCE8E6"
secondaryBackgroundColor = "#EAF1EF"
borderColor = "#C7D8D5"
primaryColor = "#168C8C"


# =====================================================================
# OTHER SETTINGS
# =====================================================================

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
